name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake 4.x
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.2.0"

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test Release
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Package Windows x64 release
        shell: pwsh
        run: .\scripts\package.ps1 -BuildDir build\Release -Version "${{ github.ref_name }}" -OutputDir artifacts

      - name: Verify package contents
        shell: pwsh
        run: |
          $archive = "artifacts/wperf-${{ github.ref_name }}-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $archive)) { throw "Package not found: $archive" }
          $entries = tar -tf $archive
          if (($entries -notcontains "wperf.exe") -or ($entries -notcontains "LICENSE")) {
            throw "Package must contain wperf.exe and LICENSE"
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wperf-${{ github.ref_name }}-windows-x64
          path: |
            artifacts/wperf-${{ github.ref_name }}-windows-x64.zip
            artifacts/wperf-${{ github.ref_name }}-windows-x64.zip.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/wperf-${{ github.ref_name }}-windows-x64.zip
            artifacts/wperf-${{ github.ref_name }}-windows-x64.zip.sha256
          generate_release_notes: true
