name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake 4.x
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.2.0"

      - name: Resolve release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $tagMatch = [regex]::Match($tag, '^v([0-9]+\.[0-9]+\.[0-9]+)(-.*)?$')
          if (-not $tagMatch.Success) { throw "Invalid release tag: $tag" }
          $source = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(\s*(?:\$\{[^}]+\}|\w+)\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          if ($tagMatch.Groups[1].Value -ne $source) { throw "Tag base version $($tagMatch.Groups[1].Value) does not match source version $source" }
          "WPERF_VERSION_SUFFIX=$($tagMatch.Groups[2].Value)" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S . -B build -A x64 -DWPERF_VERSION_SUFFIX="${{ env.WPERF_VERSION_SUFFIX }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test Release
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Verify executable version
        shell: pwsh
        run: |
          $expected = "wperf $($env:GITHUB_REF_NAME -replace '^v', '')"
          $actual = (cmd /c "build\Release\wperf.exe --version").Trim()
          if ($actual -ne $expected) { throw "Executable version '$actual' does not match '$expected'" }

      - name: Package Windows x64 release
        shell: pwsh
        run: .\scripts\package.ps1 -BuildDir build\Release -Version "${{ github.ref_name }}" -OutputDir artifacts

      - name: Verify package contents
        shell: pwsh
        run: |
          $archive = "artifacts/wperf-${{ github.ref_name }}-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $archive)) { throw "Package not found: $archive" }
          $check = "package-check"
          if (Test-Path -LiteralPath $check) { Remove-Item -LiteralPath $check -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $check
          if (-not (Test-Path -LiteralPath "$check/wperf.exe") -or
              -not (Test-Path -LiteralPath "$check/LICENSE")) { throw "Package must contain wperf.exe and LICENSE" }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wperf-${{ github.ref_name }}-windows-x64
          path: |
            artifacts/wperf-${{ github.ref_name }}-windows-x64.zip
            artifacts/wperf-${{ github.ref_name }}-windows-x64.zip.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/wperf-${{ github.ref_name }}-windows-x64.zip
            artifacts/wperf-${{ github.ref_name }}-windows-x64.zip.sha256
          generate_release_notes: true
